<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Control Panel</h2>
        
        <form id="controlForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Target IP</label>
                <input type="text" id="ip" required placeholder="127.0.0.1" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Port</label>
                <input type="number" id="port" value="30120" required 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>

            <button type="submit" 
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 transition duration-200 rounded-lg font-semibold text-white shadow-lg">
                Send Request
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        document.getElementById('controlForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const ip = document.getElementById('ip').value;
            const port = parseInt(document.getElementById('port').value);
            const statusDiv = document.getElementById('statusMessage');

            statusDiv.textContent = "Sending request...";
            statusDiv.className = "mt-4 text-center text-sm font-medium text-yellow-400";

            try {
                const response = await fetch('http://127.0.0.1:5000/ddos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ip: ip, port: port })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = data.message || "Request sent successfully!";
                    statusDiv.className = "mt-4 text-center text-sm font-medium text-green-400";
                } else {
                    statusDiv.textContent = "Error: " + (data.message || "Failed");
                    statusDiv.className = "mt-4 text-center text-sm font-medium text-red-400";
                }
            } catch (error) {
                statusDiv.textContent = "Connection error to API server!";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-red-400";
            }
        });
    </script>

</body>
</html>
